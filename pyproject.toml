[project]
name = "portal"
version = "0.1.0"
description = "Portal — paste a Repo URL, get a running container and a shareable URL (mini-IDP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "pynacl>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "api*", "runner*"]