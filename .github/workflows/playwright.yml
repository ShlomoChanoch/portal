name: Playwright Tests

# Runs on demand only.
#
# The automatic trigger stays off — that was a deliberate choice, because a
# build that fails on every push is one everyone learns to ignore. The stack
# below now boots inside CI, so the job is green when you run it from the
# Actions tab. Re-adding push/PR is now a one-line change and no longer a
# bigger piece of work:
#
#   on:
#     workflow_dispatch:
#     push:
#       branches: [ main ]
#     pull_request:
#       branches: [ main ]
#
# This repository has exactly one branch and it is `main`. No master, no
# develop — do not add either.
on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      PORTAL_ENV: dev
      # CI has no Podman and no Railpack, so the runner takes the dev-only
      # simulated path. The specs assert against whatever executor heartbeats.
      PORTAL_RUNNER_EXECUTOR: simulated

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install test-runner dependencies
        run: npm ci

      - name: Install SPA dependencies
        run: npm ci
        working-directory: frontend

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: 'python -m pip install --require-hashes --only-binary :all: -r requirements.txt'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # global-setup.ts fails fast unless BOTH are reachable, so wait for the
      # SPA and reach the api through its proxy. The api creates the data dir,
      # keys and log dir on first boot — a fresh checkout needs no prep.
      - name: Boot the stack (api + runner + SPA)
        run: |
          set -euo pipefail
          nohup uvicorn api.server:app --app-dir . --host 127.0.0.1 --port 8000 > api.log 2>&1 </dev/null &
          nohup python -m runner.main > runner.log 2>&1 </dev/null &
          nohup bash -c 'cd frontend && npm run dev' > spa.log 2>&1 </dev/null &
          for i in $(seq 1 60); do
            if curl -sf -m 2 http://127.0.0.1:5173/api/live >/dev/null; then
              echo "stack up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::stack did not become reachable within 60s"
          tail -n 60 api.log runner.log spa.log || true
          exit 1

      # @real specs build a real OCI image through Railpack/BuildKit/rootless
      # Podman. CI has none of that, so they stay excluded — they are the
      # local `npm run test:e2e:real` lane.
      - name: Run Playwright tests
        run: npx playwright test --grep-invert @real

      - name: Dump stack logs on failure
        if: failure()
        run: tail -n 100 api.log runner.log spa.log || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
